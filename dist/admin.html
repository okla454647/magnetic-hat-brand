<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWNVER｜故事管理後台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#e9e4dd;color:#171412;font:16px/1.65 "DM Sans","Noto Sans TC",sans-serif}.page{min-height:100vh;padding:30px}.head{max-width:1280px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding-bottom:28px}.logo{font:700 31px "Cormorant Garamond",serif;letter-spacing:.1em;color:inherit;text-decoration:none}.head span{font-size:13px;letter-spacing:.18em;margin-left:18px}.grid{max-width:1280px;margin:auto;display:grid;grid-template-columns:.8fr 1.2fr;gap:24px}.panel,.login{background:#f8f5f0;padding:34px}.login{width:min(520px,100%);margin:10vh auto}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;color:#73685f}.panel h1,.login h1{font:700 45px/1 "Cormorant Garamond","Noto Sans TC",serif;letter-spacing:-.025em;margin:8px 0 24px}.counter{font-size:15px;color:#73685f;margin-top:-12px}form{display:grid;gap:17px}label{display:grid;gap:7px;font-size:14px;font-weight:800}input,textarea{width:100%;border:1px solid #b7ada3;background:#fff;padding:14px;font:16px inherit}button{border:0;background:#171412;color:#fff;padding:14px 18px;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:#171412;border:1px solid #8f8378}.form-actions{display:grid;grid-template-columns:1fr auto;gap:10px}.check{display:flex;align-items:center;gap:9px}.check input{width:auto}.media-removals{display:grid;gap:8px;padding:14px;background:#eee7df}.message{background:#d9c7b6;padding:12px}.item{display:grid;grid-template-columns:145px 1fr auto;gap:16px;align-items:center;border-top:1px solid #d4ccc3;padding:17px 0}.item-media{width:145px;aspect-ratio:16/10;object-fit:cover;background:#171412}.item p{font-size:15px;color:#6d665f}.item small{color:#8c7968}.item-actions{display:grid;gap:7px}.item-actions .danger{background:#6e3028}.submissions{grid-column:1/3}.submission{display:grid;grid-template-columns:140px 1fr 220px;gap:20px;border-top:1px solid #d4ccc3;padding:19px 0}.submission b{font-size:23px}.submission p{margin:0}.submission small{color:#766b62;overflow-wrap:anywhere}@media(max-width:760px){.page{padding:15px}.grid{grid-template-columns:1fr}.panel,.login{padding:26px 20px}.item{grid-template-columns:92px 1fr}.item-media{width:92px}.item-actions{grid-column:2;grid-template-columns:1fr 1fr}.submissions{grid-column:1}.submission{grid-template-columns:1fr;gap:8px}}
</style></head><body><main class="page">
<section id="login" class="login"><a class="logo" href="index.html">OWNVER</a><p class="eyebrow">STORY STUDIO</p><h1>故事管理後台</h1><p>登入連結會寄到你的管理員 Email。</p><form id="loginForm"><label>Email<input id="email" type="email" value="qoo0985797341@gmail.com" required></label><button>寄送登入連結</button></form><p class="message" id="loginMessage" hidden></p></section>
<section id="studio" hidden><header class="head"><div><a class="logo" href="index.html">OWNVER</a><span>STORY STUDIO</span></div><button id="logout">登出</button></header><div class="grid">
<section class="panel"><p class="eyebrow" id="formEyebrow">NEW STORY</p><h1 id="formTitle">新增故事內容</h1><p class="counter">每一組可包含圖片、短影音與故事文案，首頁最多顯示 20 組。</p><form id="uploadForm"><input name="edit_id" type="hidden"><label>皮革文字<input name="word" maxlength="20" placeholder="AGAIN" required></label><label>故事文案<textarea name="summary" maxlength="300" rows="4" placeholder="這幾個字背後的故事……" required></textarea></label><label>完整故事（選填）<textarea name="story" maxlength="3000" rows="5"></textarea></label><label>短影音（選填，100MB 內）<input name="video" type="file" accept="video/mp4,video/webm,video/quicktime"></label><label>圖片（選填）<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="mediaRemovals" class="media-removals" hidden><label id="removeVideoRow" class="check" hidden><input name="remove_video" type="checkbox">刪除目前的短影音</label><label id="removeCoverRow" class="check" hidden><input name="remove_cover" type="checkbox">刪除目前的圖片</label></div><label>排列順序<input name="sort_order" type="number" min="1" max="20" value="1"></label><label class="check"><input name="published" type="checkbox" checked>顯示在首頁</label><div class="form-actions"><button id="submit">儲存故事</button><button id="cancelEdit" class="secondary" type="button" hidden>取消編輯</button></div></form><p class="message" id="message" hidden></p></section>
<section class="panel"><p class="eyebrow">LIBRARY</p><h1>首頁故事內容</h1><p id="storyCount" class="counter">0 / 20</p><div id="library"></div></section>
<section class="panel submissions"><p class="eyebrow">CUSTOMER STORIES</p><h1>顧客問卷</h1><div id="customerStories"></div></section>
</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script><script src="admin.js"></script></body></html>
