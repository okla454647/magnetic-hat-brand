<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OWNVER｜影片管理後台</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;800&family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#e9e4dd;color:#171412;font-family:"DM Sans","Noto Sans TC",sans-serif}.page{min-height:100vh;padding:30px}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;padding-bottom:28px}.logo{font-size:24px;font-weight:800;color:inherit;text-decoration:none}.head span{font-size:11px;letter-spacing:.18em;margin-left:18px}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:.85fr 1.15fr;gap:24px}.panel,.login{background:#f8f5f0;padding:34px}.login{width:min(520px,100%);margin:10vh auto}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#73685f}.panel h1,.login h1{font-size:40px;letter-spacing:-.04em;margin:8px 0 24px}form{display:grid;gap:17px}label{display:grid;gap:7px;font-size:12px;font-weight:800}input,textarea{width:100%;border:1px solid #b7ada3;background:#fff;padding:14px;font:inherit}button{border:0;background:#171412;color:#fff;padding:14px 18px;font-weight:800;cursor:pointer}.check{display:flex;align-items:center;gap:9px}.check input{width:auto}.message{background:#d9c7b6;padding:12px}.item{display:grid;grid-template-columns:145px 1fr auto;gap:16px;align-items:center;border-top:1px solid #d4ccc3;padding:17px 0}.item video{width:145px;aspect-ratio:16/9;object-fit:cover;background:#111}.item p{font-size:13px;color:#6d665f}.item small{color:#8c7968}@media(max-width:760px){.page{padding:15px}.grid{grid-template-columns:1fr}.panel,.login{padding:26px 20px}.item{grid-template-columns:100px 1fr}.item video{width:100px}.item button{grid-column:2}}</style></head><body><main class="page"><section id="login" class="login"><a class="logo" href="index.html">OWNVER</a><p class="eyebrow">STORY STUDIO</p><h1>影片管理後台</h1><p>登入連結會寄到你的管理員 Email。</p><form id="loginForm"><label>Email<input id="email" type="email" value="qoo0985797341@gmail.com" required></label><button>寄送登入連結</button></form><p class="message" id="loginMessage" hidden></p></section><section id="studio" hidden><header class="head"><div><a class="logo" href="index.html">OWNVER</a><span>STORY STUDIO</span></div><button id="logout">登出</button></header><div class="grid"><section class="panel"><p class="eyebrow">NEW STORY</p><h1>新增影片故事</h1><form id="uploadForm"><label>皮革文字<input name="word" maxlength="20" placeholder="AGAIN" required></label><label>一句話簡介<input name="summary" maxlength="100" placeholder="提醒自己，再試一次。" required></label><label>完整故事<textarea name="story" rows="5"></textarea></label><label>影片（100MB 內）<input name="video" type="file" accept="video/mp4,video/webm,video/quicktime" required></label><label>封面圖片（選填）<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label><label>排列順序<input name="sort_order" type="number" min="0" value="1"></label><label class="check"><input name="published" type="checkbox" checked>立即顯示在首頁</label><button id="submit">上傳並發布</button></form><p class="message" id="message" hidden></p></section><section class="panel"><p class="eyebrow">LIBRARY</p><h1>已上傳影片</h1><div id="library"></div></section></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.min.js"></script><script src="admin.js"></script></body></html>
